<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>JLPT N1 文法排序</title>
  <style>
    :root {
      --color-paper: #f4efe4;
      --color-paper-soft: #faf6ee;
      --color-surface: #fffdf8;
      --color-surface-raised: #ffffff;
      --color-ink: #303432;
      --color-ink-soft: #70736d;
      --color-ink-faint: #979990;
      --color-border: #d9d0c2;
      --color-border-strong: #bdb2a2;
      --color-accent: #b6534c;
      --color-accent-deep: #923e39;
      --color-accent-soft: #fbecea;
      --color-green: #4f745e;
      --color-green-soft: #e7f0e8;
      --color-green-line: #b9cdbd;
      --color-gold: #9d783b;
      --color-gold-soft: #f6eedb;
      --color-answer-paper: #fbf7ef;
      --color-answer-rose: #f8eeea;
      --color-answer-rose-line: #d8bbb4;
      --color-answer-green: #eff5ef;
      --color-answer-green-line: #c5d3c7;
      --color-answer-neutral: #f6f1e7;
      --color-danger: #a7443f;
      --color-white: #ffffff;
      --shadow-card: 0 10px 30px rgba(73, 57, 38, 0.07);
      --shadow-float: 0 8px 26px rgba(55, 43, 30, 0.16);
      --font-serif: "Hiragino Mincho ProN", "Yu Mincho", "Songti SC", serif;
      --font-sans: "Hiragino Kaku Gothic ProN", "Yu Gothic", "PingFang SC",
        "Microsoft YaHei", sans-serif;
      --radius-sm: 5px;
      --radius-md: 9px;
      --radius-lg: 13px;
      --content-max: 1180px;
      --practice-width: 860px;
      --index-width: 292px;
      --line: 1px solid var(--color-border);
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--color-paper);
      scroll-behavior: smooth;
    }

    body {
      min-width: 280px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      color: var(--color-ink);
      font-family: var(--font-sans);
      background:
        radial-gradient(circle at 13% 3%, rgba(255, 255, 255, 0.72), transparent 31rem),
        repeating-linear-gradient(
          0deg,
          rgba(80, 62, 42, 0.018) 0,
          rgba(80, 62, 42, 0.018) 1px,
          transparent 1px,
          transparent 5px
        ),
        var(--color-paper);
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 3px solid rgba(182, 83, 76, 0.25);
      outline-offset: 3px;
    }

    .app-shell {
      width: min(var(--content-max), calc(100% - 40px));
      margin: 0 auto;
      padding: 22px 0 64px;
    }

    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 272px;
      align-items: center;
      gap: 20px;
      min-width: 0;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(83, 65, 43, 0.2);
    }

    .brand {
      min-width: 0;
    }

    .brand-label {
      margin: 0 0 3px;
      color: var(--color-accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.17em;
    }

    .brand-name {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 25px;
      font-weight: 600;
      letter-spacing: 0.05em;
      white-space: nowrap;
    }

    .brand-subtitle {
      margin: 5px 0 0;
      color: var(--color-ink-soft);
      font-size: 10px;
      line-height: 1.55;
    }

    .module-tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      min-width: 0;
      margin-top: 14px;
      margin-bottom: 15px;
      overflow: hidden;
      border: 1px solid var(--color-border);
      border-radius: 999px;
      background: rgba(255, 253, 248, 0.72);
      scrollbar-width: none;
    }

    .module-tabs::-webkit-scrollbar {
      display: none;
    }

    .module-tab {
      min-height: 36px;
      padding: 0 10px;
      border: 0;
      border-radius: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--color-ink-soft);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .module-tab:first-child {
      border-radius: 999px 0 0 999px;
    }

    .module-tab:last-child {
      border-radius: 0 999px 999px 0;
    }

    .module-tab:hover {
      color: var(--color-accent);
    }

    .module-tab.is-active {
      background: var(--color-accent);
      color: var(--color-white);
      box-shadow: inset 0 0 0 1px var(--color-accent-deep);
    }

    .countdown-card {
      width: 272px;
      max-width: 100%;
      min-width: 0;
      padding: 8px 9px 9px;
      border: 1px solid var(--color-border);
      border-radius: 15px;
      background: rgba(255, 253, 248, 0.82);
      text-align: left;
    }

    .creator-bear-card__countdown {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 9px;
      min-width: 0;
      padding: 0 1px 6px;
      border-bottom: 1px solid var(--color-border);
    }

    .creator-bear-card__countdown > .countdown-days {
      flex: 0 0 auto;
      color: var(--color-accent-deep);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 25px;
      font-weight: 650;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .creator-bear-card__meta {
      order: -1;
      min-width: 0;
      color: var(--color-ink-soft);
      font-size: 9px;
      line-height: 1.35;
      white-space: nowrap;
    }

    .creator-bear-card__date {
      margin-left: 3px;
      color: var(--color-ink-soft);
      font-variant-numeric: tabular-nums;
    }

    .creator-bear-card__identity {
      display: grid;
      grid-template-columns: 58px minmax(0, 1fr);
      gap: 9px;
      align-items: center;
      padding-top: 7px;
    }

    .creator-bear-card__photo {
      display: block;
      width: 58px;
      height: 58px;
      border: 1px solid var(--color-border);
      border-radius: 9px;
      background: var(--color-surface);
      box-shadow: 0 4px 10px -8px rgba(49, 55, 51, 0.55);
      object-fit: cover;
      object-position: center 53%;
    }

    .creator-bear-card__info {
      display: grid;
      gap: 1px;
      min-width: 0;
      color: var(--color-ink-soft);
      font-size: 8.5px;
      line-height: 1.45;
    }

    .creator-bear-card__line {
      display: block;
      min-width: 0;
      white-space: nowrap;
    }

    .creator-bear-card__line--email {
      color: var(--color-ink-soft);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 8px;
      letter-spacing: -0.035em;
      text-decoration: none;
    }

    .creator-bear-card__line--email:hover,
    .creator-bear-card__line--link:hover {
      color: var(--color-accent);
      text-decoration: underline;
    }

    .creator-bear-card__line--link {
      color: inherit;
      text-decoration: none;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--index-width);
      align-items: start;
      gap: 24px;
      margin-top: 0;
    }

    .practice-column {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--color-accent);
      font-size: 9px;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .question-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-bottom: 4px;
    }

    .nav-button,
    .small-button {
      min-height: 34px;
      padding: 0 11px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--color-ink-soft);
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }

    .nav-button:hover,
    .small-button:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    .nav-button:disabled,
    .small-button:disabled {
      cursor: not-allowed;
      opacity: 0.4;
    }

    .method-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      margin-bottom: 15px;
      overflow: hidden;
      border: var(--line);
      border-radius: var(--radius-md);
      background: rgba(255, 253, 248, 0.58);
    }

    .method-step {
      display: flex;
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding: 11px 13px;
    }

    .method-step + .method-step {
      border-left: var(--line);
    }

    .method-number {
      display: grid;
      width: 23px;
      height: 23px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid var(--color-border-strong);
      border-radius: 50%;
      color: var(--color-accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
    }

    .method-title {
      display: block;
      font-size: 11px;
      font-weight: 750;
    }

    .method-copy {
      display: block;
      margin-top: 2px;
      overflow: hidden;
      color: var(--color-ink-soft);
      font-size: 9px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .panel {
      margin-bottom: 15px;
      padding: 19px;
      border: var(--line);
      border-radius: var(--radius-md);
      background: rgba(255, 253, 248, 0.88);
      box-shadow: var(--shadow-card);
    }

    .panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    .panel-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .panel-note {
      margin: 0;
      color: var(--color-ink-faint);
      font-size: 9px;
      line-height: 1.5;
      text-align: right;
    }

    .compact-sentence {
      padding: 17px 16px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-paper-soft);
      font-family: var(--font-serif);
      font-size: 17px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .inline-slot-wrap {
      display: inline-flex;
      width: 52px;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      margin: 0 3px;
      vertical-align: middle;
    }

    .star-lane {
      display: flex;
      width: 100%;
      height: 23px;
      align-items: center;
      justify-content: center;
      color: var(--color-accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      line-height: 1;
    }

    .star-lane.is-empty {
      visibility: hidden;
    }

    .inline-slot {
      position: relative;
      display: grid;
      width: 100%;
      min-height: 37px;
      place-items: center;
      padding: 0;
      border: 0;
      border-bottom: 2px solid var(--color-border-strong);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      background: transparent;
      cursor: pointer;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 19px;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .inline-slot:hover,
    .inline-slot.is-drop-target {
      border-bottom-color: var(--color-accent);
      background: var(--color-accent-soft);
    }

    .inline-slot.is-filled {
      border-bottom-color: var(--color-accent);
      background: var(--color-accent-soft);
    }

    .inline-slot.is-selected {
      box-shadow: inset 0 0 0 2px var(--color-accent);
    }

    .slot-grid {
      display: inline-grid;
      grid-template-columns: repeat(4, minmax(42px, 48px));
      grid-template-rows: 22px 38px;
      column-gap: 6px;
      margin: 0 5px;
      vertical-align: middle;
    }

    .slot-star {
      grid-row: 1;
      grid-column: 3;
      align-self: center;
      justify-self: center;
      color: var(--color-accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      line-height: 1;
      pointer-events: none;
    }

    .inline-slot.slot-cell {
      grid-row: 2;
      width: 100%;
      min-width: 0;
      min-height: 38px;
      border-right: 1px solid transparent;
      border-left: 1px solid transparent;
      font-size: 18px;
    }

    .inline-slot.slot-cell.is-composite {
      border: 1px solid var(--color-accent);
      border-bottom-width: 2px;
      background: var(--color-accent-soft);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.04em;
    }

    .number-map {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0;
      margin-top: 10px;
      color: var(--color-ink-soft);
      font-size: 11px;
      line-height: 1.8;
    }

    .map-item {
      white-space: nowrap;
    }

    .map-item.is-placed {
      color: var(--color-ink);
      font-weight: 700;
    }

    .map-item + .map-item::before {
      margin: 0 7px;
      color: var(--color-ink-faint);
      content: "·";
    }

    .map-number {
      margin-right: 3px;
      color: var(--color-accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      font-weight: 700;
    }

    .hl {
      padding: 0 1px;
      border-bottom: 1px solid var(--color-accent);
      background: var(--color-accent-soft);
      color: inherit;
    }

    .option-bank {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 9px;
      min-height: 94px;
      padding: 3px;
      border-radius: var(--radius-sm);
    }

    .option-bank.is-drop-target {
      background: var(--color-accent-soft);
      outline: 1px dashed var(--color-accent);
    }

    .option-card {
      display: grid;
      grid-template-columns: 27px minmax(0, 1fr);
      align-items: center;
      min-height: 58px;
      padding: 8px 11px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface-raised);
      color: var(--color-ink);
      cursor: grab;
      text-align: left;
      transition: border-color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
    }

    .option-card.is-composite {
      grid-template-columns: 34px minmax(0, 1fr);
      border-color: var(--color-accent);
      background: var(--color-accent-soft);
    }

    .option-card:hover {
      border-color: var(--color-border-strong);
      box-shadow: 0 4px 12px rgba(74, 60, 42, 0.07);
      transform: translateY(-1px);
    }

    .option-card.is-selected {
      border-color: var(--color-accent);
      background: var(--color-accent-soft);
      box-shadow: inset 0 0 0 1px var(--color-accent);
    }

    .option-card.is-dragging {
      opacity: 0.55;
    }

    .option-id {
      display: grid;
      width: 22px;
      height: 22px;
      place-items: center;
      border: 1px solid var(--color-accent);
      border-radius: 50%;
      color: var(--color-accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 11px;
      font-weight: 700;
    }

    .option-text {
      min-width: 0;
      font-family: var(--font-serif);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .composite-copy {
      min-width: 0;
    }

    .composite-members {
      display: block;
      margin-top: 3px;
      color: var(--color-ink-soft);
      font-family: var(--font-sans);
      font-size: 9px;
      line-height: 1.5;
    }

    .bank-empty {
      grid-column: 1 / -1;
      display: none;
      min-height: 76px;
      place-items: center;
      border: 1px dashed var(--color-border);
      border-radius: var(--radius-sm);
      color: var(--color-ink-faint);
      font-size: 11px;
      text-align: center;
    }

    .bank-empty.is-visible {
      display: grid;
    }

    .workbench {
      display: grid;
      grid-template-columns: minmax(0, 1.18fr) minmax(0, 0.82fr);
      gap: 12px;
      margin-bottom: 15px;
    }

    .workbench .panel {
      min-width: 0;
      margin-bottom: 0;
      padding: 16px;
    }

    .workbench .panel-head {
      margin-bottom: 11px;
    }

    .combo-panel {
      display: flex;
      min-height: 100%;
      flex-direction: column;
      background: rgba(246, 238, 219, 0.46);
    }

    .combo-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 7px;
      margin-bottom: 10px;
    }

    .combo-sequence {
      min-height: 44px;
      margin-bottom: 10px;
      padding: 8px 10px;
      border: 1px dashed var(--color-border-strong);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      color: var(--color-ink-soft);
      font-size: 10px;
      line-height: 1.7;
    }

    .combo-sequence strong {
      color: var(--color-accent-deep);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      letter-spacing: 0.05em;
    }

    .combo-list {
      display: grid;
      gap: 6px;
      margin-top: 4px;
    }

    .combo-item {
      display: grid;
      grid-template-columns: 27px minmax(0, 1fr) auto;
      align-items: center;
      gap: 7px;
      padding: 7px 8px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
    }

    .combo-name {
      color: var(--color-accent-deep);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 16px;
      font-weight: 700;
    }

    .combo-item-copy {
      min-width: 0;
      overflow: hidden;
      color: var(--color-ink-soft);
      font-size: 9px;
      line-height: 1.55;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .combo-empty {
      color: var(--color-ink-faint);
      font-size: 9px;
      line-height: 1.65;
    }

    .workbench-tip {
      margin: auto 0 0;
      padding-top: 10px;
      color: var(--color-ink-faint);
      font-size: 9px;
      line-height: 1.65;
    }

    .preview-panel {
      background: rgba(250, 246, 238, 0.9);
    }

    .preview-text {
      min-height: 93px;
      margin: 0;
      padding: 12px 2px 9px;
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 500;
      letter-spacing: 0.015em;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .preview-blank {
      color: var(--color-ink-faint);
      font-family: var(--font-sans);
      letter-spacing: 0.1em;
    }

    .control-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin: 3px 0 15px;
    }

    .action-button {
      min-height: 39px;
      padding: 0 15px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      color: var(--color-ink);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .action-button:hover:not(:disabled) {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    .action-button.primary {
      margin-left: auto;
      border-color: var(--color-accent);
      background: var(--color-accent);
      color: var(--color-white);
    }

    .action-button.primary:hover:not(:disabled) {
      background: var(--color-accent-deep);
      color: var(--color-white);
    }

    .action-button:disabled {
      cursor: not-allowed;
      opacity: 0.46;
    }

    .status-line {
      width: 100%;
      min-height: 16px;
      color: var(--color-ink-soft);
      font-size: 10px;
      line-height: 1.5;
    }

    .hint-panel {
      padding: 15px 17px;
      border: 1px solid var(--color-gold);
      border-radius: var(--radius-md);
      background: var(--color-gold-soft);
    }

    .hint-panel + .hint-panel,
    .feedback-box + .feedback-box {
      margin-top: 12px;
    }

    .hint-title,
    .feedback-title {
      margin: 0 0 8px;
      font-family: var(--font-serif);
      font-size: 13px;
      font-weight: 700;
    }

    .hint-list {
      display: grid;
      gap: 7px;
      margin: 0;
      padding-left: 21px;
      color: var(--color-ink-soft);
      font-size: 11px;
      line-height: 1.75;
    }

    .hint-stage {
      margin-right: 5px;
      color: var(--color-gold);
      font-weight: 750;
    }

    .feedback-box {
      padding: 16px 17px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: var(--color-answer-paper);
    }

    .feedback-box.wrong {
      border-color: var(--color-answer-rose-line);
      background: var(--color-answer-rose);
      box-shadow: inset 3px 0 0 var(--color-accent);
    }

    .feedback-box.correct {
      border-color: var(--color-answer-green-line);
      background: var(--color-answer-green);
      box-shadow: inset 3px 0 0 var(--color-green);
    }

    .feedback-copy {
      margin: 0;
      color: var(--color-ink-soft);
      font-size: 11px;
      line-height: 1.8;
    }

    .feedback-icon {
      display: inline-grid;
      width: 19px;
      height: 19px;
      margin-right: 5px;
      place-items: center;
      border-radius: 50%;
      font-family: var(--font-sans);
      font-size: 12px;
      line-height: 1;
    }

    .wrong .feedback-icon {
      background: var(--color-accent);
      color: var(--color-white);
    }

    .correct .feedback-icon {
      background: var(--color-green);
      color: var(--color-white);
    }

    .result-box {
      margin-top: 15px;
      overflow: hidden;
      border: 1px solid var(--color-answer-green-line);
      border-radius: var(--radius-md);
      background: var(--color-answer-paper);
      box-shadow: var(--shadow-card);
    }

    .result-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 17px;
      border-bottom: 1px solid var(--color-answer-green-line);
      background: var(--color-answer-green);
      color: var(--color-green);
    }

    .result-box.is-revealed {
      border-color: var(--color-answer-rose-line);
    }

    .result-box.is-revealed .result-head {
      border-bottom-color: var(--color-answer-rose-line);
      background: var(--color-answer-rose);
      color: var(--color-accent-deep);
    }

    .result-head h2 {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 650;
    }

    .result-order {
      padding: 3px 8px;
      border: 1px solid currentColor;
      border-radius: 999px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .result-body {
      padding: 18px;
    }

    .meta-label {
      margin: 0 0 6px;
      color: var(--color-ink-soft);
      font-size: 9px;
      font-weight: 750;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .exact-sentence {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 19px;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .translation {
      margin: 9px 0 0;
      color: var(--color-ink-soft);
      font-size: 11px;
      line-height: 1.8;
    }

    .star-answer {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 15px;
      padding: 11px 13px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-answer-neutral);
    }

    .star-answer-mark {
      color: var(--color-accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 21px;
    }

    .star-answer-text {
      margin: 0;
      font-size: 11px;
      line-height: 1.7;
    }

    .reasoning {
      display: grid;
      gap: 8px;
      margin-top: 15px;
    }

    .reasoning-step {
      display: grid;
      grid-template-columns: 74px minmax(0, 1fr);
      gap: 11px;
      padding: 11px 13px;
      border: 1px solid var(--color-border);
      border-left: 3px solid var(--color-answer-green-line);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      background: var(--color-answer-paper);
    }

    .reasoning-step strong {
      color: var(--color-ink);
      font-size: 10px;
    }

    .reasoning-step p {
      margin: 0;
      color: var(--color-ink-soft);
      font-size: 10px;
      line-height: 1.75;
    }

    .reasoning-fields {
      display: grid;
      gap: 5px;
    }

    .reasoning-field {
      margin: 0;
    }

    .reasoning-field strong {
      display: inline;
      margin-right: 5px;
      color: var(--color-ink-soft);
      font-size: 9px;
    }

    .reasoning-conclusion {
      color: var(--color-ink) !important;
      font-weight: 750;
    }

    .reasoning-links {
      display: flex;
      flex-wrap: wrap;
      grid-column: 2;
      gap: 5px;
      margin-top: 2px;
    }

    .evidence-link {
      min-height: 25px;
      padding: 0 8px;
      font-size: 8px;
    }

    .question-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 12px;
      padding: 8px 11px;
      border-left: 3px solid var(--color-ink);
      background: rgba(255, 253, 248, 0.58);
      color: var(--color-ink-soft);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 11px;
      letter-spacing: 0.04em;
    }

    .question-toolbar strong {
      color: var(--color-ink);
      font-size: 17px;
      font-weight: 500;
    }

    .exam-paper,
    .evidence-paper,
    .empty-state,
    .math-placeholder,
    .wrong-item {
      border: var(--line);
      border-radius: var(--radius-md);
      background: rgba(255, 253, 248, 0.92);
      box-shadow: var(--shadow-card);
    }

    .exam-paper {
      padding: 23px;
    }

    .exam-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 20px;
      color: var(--color-ink-faint);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .exam-instruction {
      margin: 0 0 13px;
      color: var(--color-ink-soft);
      font-size: 11px;
      line-height: 1.7;
    }

    .exam-sentence {
      margin: 0;
      padding: 18px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-paper-soft);
      font-family: var(--font-serif);
      font-size: 17px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .exam-blank {
      display: inline-grid;
      min-width: 42px;
      height: 30px;
      margin: 0 3px;
      place-items: center;
      border-bottom: 2px solid var(--color-border-strong);
      color: var(--color-accent);
      font-family: var(--font-sans);
      font-size: 10px;
      font-weight: 700;
      vertical-align: middle;
    }

    .exam-options {
      display: grid;
      gap: 8px;
      margin-top: 18px;
    }

    .exam-option {
      display: grid;
      grid-template-columns: 29px minmax(0, 1fr) 21px;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 48px;
      padding: 8px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface-raised);
      cursor: pointer;
      text-align: left;
    }

    .exam-option:hover:not(:disabled) {
      border-color: var(--color-accent);
    }

    .exam-option.is-selected {
      border-color: var(--color-accent);
      background: var(--color-accent-soft);
    }

    .exam-option.is-choice-correct {
      border-color: var(--color-green-line);
      background: var(--color-answer-green);
      color: var(--color-green);
    }

    .exam-option.is-choice-wrong {
      border-color: var(--color-answer-rose-line);
      background: var(--color-answer-rose);
      color: var(--color-accent-deep);
      box-shadow: inset 3px 0 0 var(--color-accent);
    }

    .exam-option.is-answer-correct {
      border: 1px solid var(--color-green-line);
      background: var(--color-answer-green);
      color: var(--color-green);
      box-shadow: inset 3px 0 0 var(--color-green);
    }

    .exam-option:disabled {
      cursor: default;
    }

    .exam-number {
      display: grid;
      width: 22px;
      height: 22px;
      place-items: center;
      border-radius: 50%;
      background: var(--color-paper-soft);
      color: var(--color-accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 11px;
      font-weight: 700;
    }

    .exam-option-text {
      font-family: var(--font-serif);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .radio-mark {
      width: 14px;
      height: 14px;
      border: 1px solid var(--color-border-strong);
      border-radius: 50%;
    }

    .exam-option.is-selected .radio-mark {
      border: 4px solid var(--color-accent);
    }

    .exam-option.is-choice-correct .radio-mark,
    .exam-option.is-answer-correct .radio-mark {
      border: 4px solid var(--color-green);
    }

    .exam-option.is-choice-wrong .radio-mark {
      border: 4px solid var(--color-accent);
    }

    .exam-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 17px;
    }

    .exam-feedback {
      margin-top: 17px;
    }

    .exam-question-nav,
    .question-footer-nav {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--color-border);
    }

    .exam-question-nav .action-button,
    .question-footer-nav .action-button {
      width: 100%;
      margin: 0;
    }

    .exam-question-nav .answer-button,
    .question-footer-nav .answer-button {
      border-color: var(--color-accent);
      color: var(--color-accent-deep);
    }

    .evidence-paper {
      overflow: hidden;
    }

    .evidence-top {
      padding: 19px 21px 17px;
      border-bottom: 1px solid var(--color-border);
      background: var(--color-paper-soft);
    }

    .evidence-point {
      margin: 0;
      color: var(--color-accent-deep);
      font-family: var(--font-serif);
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .evidence-subtitle {
      margin: 5px 0 0;
      color: var(--color-ink-soft);
      font-size: 10px;
    }

    .evidence-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .evidence-field {
      min-width: 0;
      padding: 16px 20px;
      border-bottom: 1px solid var(--color-border);
    }

    .evidence-field:nth-child(odd) {
      border-right: 1px solid var(--color-border);
    }

    .evidence-field.is-wide {
      grid-column: 1 / -1;
      border-right: 0;
    }

    .evidence-field:last-child {
      border-bottom: 0;
    }

    .field-label {
      margin: 0 0 7px;
      color: var(--color-ink-faint);
      font-size: 9px;
      font-weight: 750;
      letter-spacing: 0.12em;
    }

    .field-value {
      margin: 0;
      color: var(--color-ink);
      font-family: var(--font-serif);
      font-size: 13px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }

    .field-value.is-example {
      color: var(--color-green);
    }

    .evidence-source {
      padding: 11px 20px;
      border-top: 1px solid var(--color-border);
      color: var(--color-ink-faint);
      font-size: 9px;
      line-height: 1.6;
    }

    .flashcard-panel {
      padding: 17px;
    }

    .flashcard-tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 15px;
    }

    .flashcard-tab {
      display: grid;
      min-height: 74px;
      align-content: center;
      padding: 11px 14px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      color: var(--color-ink-soft);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      text-align: left;
    }

    .flashcard-tab > span {
      color: var(--color-accent-deep);
      font-family: var(--font-serif);
      font-size: 14px;
      line-height: 1.45;
    }

    .flashcard-tab small {
      display: block;
      margin-top: 5px;
      color: var(--color-ink-faint);
      font-size: 9px;
      font-weight: 500;
      line-height: 1.45;
    }

    .flashcard-tab:hover,
    .flashcard-tab.is-open {
      border-color: var(--color-accent);
      background: var(--color-accent-soft);
      color: var(--color-accent-deep);
      box-shadow: inset 0 0 0 1px var(--color-accent);
    }

    .flashcard-stage {
      min-height: 160px;
      padding: 18px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background:
        linear-gradient(135deg, transparent 0 48%, rgba(182, 83, 76, 0.035) 48% 52%, transparent 52%),
        var(--color-paper-soft);
    }

    .flashcard-placeholder {
      display: grid;
      min-height: 122px;
      place-items: center;
      color: var(--color-ink-faint);
      font-size: 10px;
      line-height: 1.8;
      text-align: center;
    }

    .flashcard-answer h2 {
      margin: 0 0 8px;
      color: var(--color-accent-deep);
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 650;
    }

    .flashcard-answer p {
      margin: 0;
      color: var(--color-ink);
      font-size: 12px;
      line-height: 1.9;
    }

    .flashcard-detail-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-top: 13px;
    }

    .flashcard-detail {
      min-width: 0;
      padding: 9px 10px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: rgba(255, 253, 248, 0.76);
    }

    .flashcard-detail.is-wide {
      grid-column: 1 / -1;
    }

    .flashcard-detail dt {
      margin-bottom: 4px;
      color: var(--color-accent-deep);
      font-size: 8px;
      font-weight: 750;
      letter-spacing: 0.08em;
    }

    .flashcard-detail dd {
      margin: 0;
      color: var(--color-ink-soft);
      font-family: var(--font-serif);
      font-size: 10px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .flashcard-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 12px;
    }

    .flashcard-chip {
      padding: 3px 7px;
      border: 1px solid var(--color-border);
      border-radius: 999px;
      background: var(--color-surface);
      color: var(--color-ink-soft);
      font-size: 8px;
      line-height: 1.5;
    }

    .empty-state,
    .math-placeholder {
      display: grid;
      min-height: 330px;
      place-items: center;
      padding: 40px;
      text-align: center;
    }

    .empty-inner {
      max-width: 350px;
    }

    .empty-mark {
      display: grid;
      width: 54px;
      height: 54px;
      margin: 0 auto 15px;
      place-items: center;
      border: 1px solid var(--color-border);
      border-radius: 50%;
      color: var(--color-accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 24px;
    }

    .empty-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 21px;
      font-weight: 600;
    }

    .empty-copy {
      margin: 9px 0 0;
      color: var(--color-ink-soft);
      font-size: 11px;
      line-height: 1.8;
    }

    .record-shell {
      display: grid;
      gap: 12px;
    }

    .record-stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .record-stat {
      min-height: 76px;
      padding: 13px 15px;
      border: var(--line);
      border-radius: var(--radius-md);
      background: rgba(255, 253, 248, 0.9);
      box-shadow: var(--shadow-card);
    }

    .record-stat span {
      display: block;
      margin-bottom: 7px;
      color: var(--color-ink-faint);
      font-size: 9px;
    }

    .record-stat b {
      color: var(--color-ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 23px;
      font-weight: 500;
      line-height: 1;
    }

    .record-panel {
      padding: 15px 16px;
      border: var(--line);
      border-radius: var(--radius-md);
      background: rgba(255, 253, 248, 0.9);
      box-shadow: var(--shadow-card);
    }

    .record-panel > h2 {
      margin: 0 0 12px;
      font-family: var(--font-serif);
      font-size: 14px;
    }

    .record-bars {
      display: grid;
      gap: 9px;
    }

    .record-bar-row {
      display: grid;
      grid-template-columns: minmax(90px, 1.1fr) minmax(90px, 2fr) 24px;
      align-items: center;
      gap: 9px;
      color: var(--color-ink-soft);
      font-size: 9px;
    }

    .record-bar-track {
      height: 4px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--color-paper-deep);
    }

    .record-bar-track i {
      display: block;
      height: 100%;
      border-radius: inherit;
      background: var(--color-accent);
    }

    .record-empty {
      margin: 0;
      padding: 18px 8px;
      color: var(--color-ink-faint);
      font-size: 10px;
      line-height: 1.7;
      text-align: center;
    }

    .wrong-list {
      display: grid;
      gap: 10px;
    }

    .wrong-item {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr) auto;
      align-items: center;
      gap: 14px;
      padding: 15px 17px;
    }

    .wrong-number {
      color: var(--color-accent-deep);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 27px;
    }

    .wrong-state {
      margin: 0 0 4px;
      color: var(--color-accent);
      font-size: 10px;
      font-weight: 750;
    }

    .wrong-star {
      margin: 0;
      color: var(--color-ink-soft);
      font-size: 11px;
      line-height: 1.6;
    }

    .wrong-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 6px;
    }

    .sidebar {
      position: sticky;
      top: 22px;
      max-height: calc(100vh - 44px);
      overflow-x: hidden;
      overflow-y: auto;
      border: var(--line);
      border-radius: var(--radius-md);
      background: rgba(255, 253, 248, 0.92);
      box-shadow: var(--shadow-card);
      scrollbar-width: thin;
      scrollbar-color: var(--color-border-strong) transparent;
    }

    .sidebar-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 18px 17px 12px;
    }

    .sidebar-title {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 17px;
      font-weight: 700;
    }

    .drawer-close {
      display: none;
      width: 32px;
      height: 32px;
      padding: 0;
      border: 1px solid var(--color-border);
      border-radius: 50%;
      background: var(--color-surface);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .search-wrap {
      padding: 0 15px 13px;
    }

    .search-input {
      width: 100%;
      min-height: 38px;
      padding: 0 11px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-paper-soft);
      color: var(--color-ink);
      font-size: 10px;
    }

    .search-input::placeholder {
      color: var(--color-ink-faint);
    }

    .index-body {
      padding: 0 15px 16px;
    }

    .index-period {
      margin: 0 0 9px;
      padding-top: 12px;
      border-top: 1px solid var(--color-border);
      color: var(--color-ink-soft);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 11px;
      letter-spacing: 0.09em;
    }

    .index-group + .index-group {
      margin-top: 12px;
      padding-top: 11px;
      border-top: 1px solid var(--color-border);
    }

    .index-group-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .index-group-head h3 {
      margin: 0;
      color: var(--color-ink-soft);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.07em;
    }

    .index-group-head span {
      color: var(--color-ink-faint);
      font-size: 8px;
    }

    .index-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 6px;
    }

    .index-button {
      position: relative;
      display: grid;
      min-width: 0;
      aspect-ratio: 1.05;
      place-items: center;
      padding: 0;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      color: var(--color-ink-soft);
      cursor: pointer;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
    }

    .index-button:hover {
      border-color: var(--color-accent);
      color: var(--color-accent);
    }

    .index-button.is-wrong {
      border-color: var(--color-accent);
      background: var(--color-accent-soft);
      color: var(--color-accent-deep);
    }

    .index-button.is-solved,
    .index-button.is-correct {
      border-color: var(--color-green-line);
      background: var(--color-green-soft);
      color: var(--color-green);
    }

    .index-button.is-current {
      border-color: var(--color-ink);
      box-shadow: inset 3px 0 0 var(--color-ink), inset 0 0 0 1px var(--color-ink);
    }

    .index-badge {
      position: absolute;
      right: -3px;
      bottom: -5px;
      padding: 1px 3px;
      border: 1px solid var(--color-accent);
      border-radius: 999px;
      background: var(--color-surface);
      color: var(--color-accent);
      font-family: var(--font-sans);
      font-size: 6px;
      font-weight: 750;
      line-height: 1.4;
      white-space: nowrap;
    }

    .index-button.is-current .index-badge {
      border-color: var(--color-white);
      background: var(--color-accent-deep);
      color: var(--color-white);
    }

    .index-empty {
      margin: 9px 0 0;
      color: var(--color-ink-faint);
      font-size: 10px;
      line-height: 1.6;
    }

    .index-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 12px;
      margin-top: 16px;
      padding-top: 11px;
      border-top: 1px solid var(--color-border);
      color: var(--color-ink-faint);
      font-size: 8px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .legend-dot {
      display: block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .legend-dot.current {
      border: 1px solid var(--color-ink);
      background: var(--color-surface);
    }

    .legend-dot.solved {
      background: var(--color-green);
    }

    .legend-dot.wrong {
      border: 1px solid var(--color-accent);
      background: var(--color-accent-soft);
    }

    .mobile-index-toggle,
    .drawer-backdrop {
      display: none;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    @media (max-width: 980px) {
      .app-shell {
        width: min(100% - 28px, var(--practice-width));
      }

      .masthead {
        grid-template-columns: minmax(0, 1fr) 272px;
        gap: 14px;
      }

      .module-tab {
        padding: 0 11px;
      }

      .layout {
        display: block;
      }

      .sidebar {
        position: fixed;
        z-index: 1002;
        top: 0;
        right: 0;
        width: min(86vw, 330px);
        height: 100dvh;
        max-height: none;
        border-radius: var(--radius-md) 0 0 var(--radius-md);
        transform: translateX(105%);
        transition: transform 0.2s ease;
      }

      .sidebar.is-open {
        transform: translateX(0);
      }

      .drawer-close {
        display: block;
      }

      .drawer-backdrop {
        position: fixed;
        z-index: 1001;
        inset: 0;
        display: block;
        visibility: hidden;
        background: rgba(48, 52, 50, 0.36);
        opacity: 0;
        transition: opacity 0.2s ease, visibility 0.2s ease;
      }

      .drawer-backdrop.is-open {
        visibility: visible;
        opacity: 1;
      }

      .mobile-index-toggle {
        position: fixed;
        z-index: 900;
        right: 15px;
        bottom: 15px;
        display: block;
        min-height: 42px;
        padding: 0 15px;
        border: 1px solid var(--color-accent);
        border-radius: 999px;
        background: var(--color-accent);
        color: var(--color-white);
        box-shadow: var(--shadow-float);
        cursor: pointer;
        font-size: 11px;
        font-weight: 750;
      }

      body.drawer-open {
        overflow: hidden;
      }
    }

    @media (max-width: 680px) {
      .app-shell {
        width: calc(100% - 24px);
        padding-top: 13px;
      }

      .masthead {
        grid-template-columns: minmax(0, 1fr);
        gap: 10px;
      }

      .module-tabs {
        margin-bottom: 12px;
      }

      .module-tab {
        min-height: 34px;
        padding: 0 4px;
        font-size: 10px;
      }

      .countdown-card {
        grid-column: 1 / -1;
        width: 272px;
        max-width: 100%;
        justify-self: center;
      }

      .layout {
        margin-top: 14px;
      }

      .page-head {
        display: block;
        min-height: 0;
        padding-bottom: 14px;
      }

      .page-title {
        font-size: 32px;
      }

      .page-note {
        margin-top: 6px;
      }

      .question-nav {
        margin-top: 10px;
      }

      .method-step {
        gap: 5px;
        padding: 9px 5px;
      }

      .method-copy {
        font-size: 8px;
      }

      .method-number {
        width: 19px;
        height: 19px;
        font-size: 10px;
      }

      .panel {
        padding: 14px;
      }

      .panel-note {
        max-width: 140px;
        font-size: 8px;
      }

      .compact-sentence {
        padding: 11px 6px;
        font-size: 14px;
        line-height: 1.8;
      }

      .inline-slot-wrap {
        width: 39px;
        margin: 0 2px;
      }

      .star-lane {
        height: 20px;
        font-size: 14px;
      }

      .inline-slot {
        min-height: 33px;
        font-size: 17px;
      }

      .slot-grid {
        grid-template-columns: repeat(4, minmax(29px, 34px));
        grid-template-rows: 20px 34px;
        column-gap: 4px;
        margin: 0 3px;
      }

      .inline-slot.slot-cell {
        min-height: 34px;
        font-size: 16px;
      }

      .inline-slot.slot-cell.is-composite {
        font-size: 9px;
      }

      .number-map {
        font-size: 10px;
      }

      .option-bank {
        grid-template-columns: 1fr;
      }

      .workbench {
        grid-template-columns: 1fr;
      }

      .workbench .panel {
        padding: 13px;
      }

      .option-card {
        min-height: 50px;
      }

      .preview-text {
        min-height: 86px;
        font-size: 20px;
        line-height: 1.85;
      }

      .control-row {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .action-button {
        width: 100%;
        padding: 0 8px;
        font-size: 10px;
      }

      .action-button.primary {
        grid-column: 1 / -1;
        margin-left: 0;
      }

      .reasoning-step {
        grid-template-columns: 65px minmax(0, 1fr);
      }

      .exam-paper {
        padding: 15px;
      }

      .exam-sentence {
        padding: 12px 8px;
        font-size: 14px;
        line-height: 2;
      }

      .exam-blank {
        min-width: 31px;
        height: 27px;
        margin: 0 1px;
      }

      .evidence-grid {
        grid-template-columns: 1fr;
      }

      .evidence-field,
      .evidence-field:nth-child(odd) {
        border-right: 0;
      }

      .flashcard-panel {
        padding: 13px;
      }

      .flashcard-tabs {
        grid-template-columns: 1fr;
      }

      .flashcard-stage {
        min-height: 145px;
        padding: 14px;
      }

      .flashcard-answer h2 {
        font-size: 18px;
      }

      .flashcard-detail-grid {
        grid-template-columns: 1fr;
      }

      .flashcard-detail.is-wide {
        grid-column: auto;
      }

      .wrong-item {
        grid-template-columns: 41px minmax(0, 1fr);
        gap: 9px;
        padding: 13px;
      }

      .wrong-number {
        font-size: 23px;
      }

      .wrong-actions {
        grid-column: 1 / -1;
        justify-content: flex-start;
        padding-left: 50px;
      }

      .empty-state,
      .math-placeholder {
        min-height: 280px;
        padding: 26px 18px;
      }
    }

    .math-shell {
      --math-red: var(--color-accent);
      --math-red-deep: var(--color-accent-deep);
      --math-red-soft: var(--color-accent-soft);
      --math-ink: var(--color-ink);
      --math-line: var(--color-border);
      display: grid;
      gap: 13px;
    }

    .math-question-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 236px;
      gap: 12px;
    }

    .math-card {
      min-width: 0;
      padding: 16px;
      border: var(--line);
      border-radius: var(--radius-md);
      background: rgba(255, 253, 248, 0.9);
      box-shadow: var(--shadow-card);
    }

    .math-sentence {
      min-height: 101px;
      padding: 14px 12px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-paper-soft);
      font-family: var(--font-serif);
      font-size: 16px;
      line-height: 2;
      overflow-wrap: anywhere;
    }

    .math-inline-slot {
      display: inline-flex;
      width: 54px;
      min-height: 62px;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      margin: 0 3px;
      vertical-align: middle;
    }

    .math-inline-star {
      height: 18px;
      color: var(--color-accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 15px;
      line-height: 1;
    }

    .math-inline-star.is-empty {
      visibility: hidden;
    }

    .math-inline-candidates {
      display: flex;
      width: 100%;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      padding: 3px;
      border-bottom: 2px solid var(--color-border-strong);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      background: var(--color-surface);
      color: var(--color-ink-soft);
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      text-align: center;
    }

    .math-inline-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transform: translateY(1px);
    }

    .math-inline-candidates.is-assigned {
      border-color: var(--color-accent);
      background: var(--color-accent-soft);
      color: var(--color-accent-deep);
      font-size: 19px;
      font-weight: 750;
    }

    .math-star-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      border: 1px solid var(--color-accent);
      border-radius: var(--radius-md);
      background:
        repeating-linear-gradient(
          -3deg,
          rgba(148, 61, 55, 0.025) 0,
          rgba(148, 61, 55, 0.025) 1px,
          transparent 1px,
          transparent 7px
        ),
        #fffaf6;
      text-align: center;
    }

    .math-chance {
      color: var(--color-accent-deep);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 61px;
      font-weight: 700;
      line-height: 0.9;
      transform: rotate(-3deg);
    }

    .math-chance-label {
      margin: 6px 0 8px;
      color: var(--color-accent-deep);
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 700;
    }

    .math-chance-copy,
    .math-chance-meta,
    .math-status {
      margin: 0;
      color: var(--color-ink-soft);
      font-size: 9px;
      line-height: 1.55;
      text-align: center;
    }

    .math-chance-meta {
      margin-top: 3px;
      color: var(--color-ink-faint);
    }

    .math-primary {
      width: 100%;
      min-height: 43px;
      margin-top: 10px;
      border: 1px solid var(--color-accent-deep);
      border-radius: var(--radius-sm);
      background: var(--color-accent);
      color: var(--color-white);
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
    }

    .math-primary:disabled {
      border-color: var(--color-border);
      background: var(--color-paper-deep);
      color: var(--color-ink-faint);
      cursor: not-allowed;
    }

    .math-reset {
      margin-top: 6px;
      padding: 2px 5px;
      border: 0;
      background: transparent;
      color: var(--color-ink-faint);
      cursor: pointer;
      font-size: 8px;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .math-workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 12px;
      align-items: stretch;
    }

    .math-section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .math-section-head h2 {
      margin: 0;
      font-family: var(--font-serif);
      font-size: 15px;
    }

    .math-section-head p {
      margin: 0;
      color: var(--color-ink-faint);
      font-size: 10px;
      text-align: right;
    }

    .math-matrix-wrap {
      max-width: 100%;
      overflow-x: auto;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      scrollbar-width: thin;
    }

    .math-mobile-board {
      display: none;
    }

    .math-matrix {
      display: grid;
      grid-template-columns: minmax(155px, 1.5fr) repeat(4, minmax(66px, 0.7fr));
      min-width: 550px;
    }

    .math-matrix-head,
    .math-matrix-option,
    .math-matrix-cell,
    .math-matrix-bottom {
      min-width: 0;
      border-right: 1px solid var(--color-border);
      border-bottom: 1px solid var(--color-border);
    }

    .math-matrix > :nth-child(5n) {
      border-right: 0;
    }

    .math-matrix-head {
      padding: 8px 5px;
      background: var(--color-paper-soft);
      color: var(--color-ink-soft);
      font-size: 11px;
      font-weight: 750;
      text-align: center;
    }

    .math-matrix-head.is-star {
      background: var(--color-accent-soft);
      color: var(--color-accent-deep);
    }

    .math-matrix-option {
      display: grid;
      grid-template-columns: 23px minmax(0, 1fr);
      align-items: center;
      gap: 6px;
      padding: 8px 9px;
      background: var(--color-surface);
      font-family: var(--font-serif);
      font-size: 13px;
      white-space: nowrap;
    }

    .math-matrix-option b {
      color: var(--color-accent);
      font-family: Georgia, "Times New Roman", serif;
    }

    .math-matrix-option span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .math-matrix-cell {
      display: grid;
      place-items: center;
      padding: 6px;
      background: rgba(255, 253, 248, 0.7);
    }

    .math-candidate {
      display: inline-grid;
      grid-template-columns: 27px 21px;
      overflow: hidden;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      background: var(--color-surface);
    }

    .math-candidate.is-selected {
      border-color: var(--color-accent);
      box-shadow: inset 0 0 0 1px var(--color-accent);
    }

    .math-candidate.is-assigned {
      border-color: var(--color-green);
      background: var(--color-green-soft);
    }

    .math-candidate.is-blocked {
      opacity: 0.42;
      background: var(--color-paper-soft);
    }

    .math-number,
    .math-block {
      min-height: 31px;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 13px;
      font-weight: 750;
    }

    .math-number {
      border-right: 1px solid var(--color-border);
      color: var(--color-ink);
    }

    .math-block {
      color: var(--color-accent);
      font-size: 15px;
    }

    .math-number:disabled,
    .math-block:disabled {
      cursor: default;
    }

    .math-matrix-bottom {
      display: grid;
      place-items: center;
      padding: 7px;
      background: var(--color-paper-soft);
    }

    .math-assign {
      width: 100%;
      min-height: 38px;
      padding: 4px;
      border: 1px solid var(--color-accent);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      color: var(--color-accent-deep);
      cursor: pointer;
      font-size: 11px;
      font-weight: 750;
      line-height: 1.35;
    }

    .math-assign.is-undo {
      border-color: var(--color-green);
      color: var(--color-green);
    }

    .math-assign:disabled {
      border-color: var(--color-border);
      color: var(--color-ink-faint);
      cursor: not-allowed;
    }

    .math-status {
      min-height: 16px;
      margin-top: 8px;
      text-align: left;
    }

    .math-sequence {
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 15px;
      background: var(--color-gold-soft);
    }

    .math-lock-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(240px, 0.85fr);
      gap: 12px;
    }

    .math-lock-settings,
    .math-lock-results {
      display: grid;
      align-content: start;
      gap: 8px;
    }

    .math-lock-mode {
      display: grid;
      grid-template-columns: 1fr 1fr;
      overflow: hidden;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
    }

    .math-lock-mode button {
      min-height: 33px;
      padding: 3px;
      border: 0;
      background: var(--color-surface);
      color: var(--color-ink-soft);
      cursor: pointer;
      font-size: 9px;
    }

    .math-lock-mode button.is-active {
      background: var(--color-accent);
      color: var(--color-white);
    }

    .math-lock-pickers {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 6px;
    }

    .math-lock-side {
      padding: 7px;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
    }

    .math-lock-side span {
      display: block;
      margin-bottom: 5px;
      color: var(--color-ink-faint);
      font-size: 11px;
    }

    .math-lock-numbers {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
    }

    .math-lock-number {
      min-height: 29px;
      border: 1px solid var(--color-border);
      border-radius: 5px;
      background: var(--color-surface);
      color: var(--color-ink-soft);
      cursor: pointer;
      font-size: 12px;
    }

    .math-lock-number.is-selected {
      border-color: var(--color-accent);
      background: var(--color-accent-soft);
      color: var(--color-accent-deep);
    }

    .math-lock-arrow {
      color: var(--color-accent);
      font-size: 16px;
    }

    .math-lock-add {
      min-height: 39px;
      border: 1px solid var(--color-accent);
      border-radius: var(--radius-sm);
      background: var(--color-accent);
      color: var(--color-white);
      cursor: pointer;
      font-size: 10px;
      font-weight: 750;
    }

    .math-lock-add:disabled {
      border-color: var(--color-border);
      background: var(--color-paper-deep);
      color: var(--color-ink-faint);
      cursor: not-allowed;
    }

    .math-lock-list {
      display: grid;
      gap: 5px;
    }

    .math-lock-chip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 7px;
      border: 1px solid var(--color-border);
      border-radius: 999px;
      background: var(--color-surface);
      color: var(--color-ink-soft);
      font-size: 10px;
      line-height: 1.4;
    }

    .math-lock-chip.is-negative {
      border-color: var(--color-accent);
      color: var(--color-accent-deep);
    }

    .math-lock-chip button {
      padding: 0 3px;
      border: 0;
      background: transparent;
      color: var(--color-accent);
      cursor: pointer;
      font-size: 12px;
    }

    .math-lock-result {
      margin: 0;
      color: var(--color-ink-faint);
      font-size: 8px;
      line-height: 1.55;
    }

    .math-clues {
      padding: 14px 16px;
    }

    .math-clue-list {
      display: grid;
      gap: 7px;
    }

    .math-clue-item {
      padding: 9px 11px;
      border-left: 2px solid var(--color-gold);
      background: var(--color-gold-soft);
    }

    .math-clue-item strong {
      display: block;
      margin-bottom: 3px;
      color: var(--color-ink);
      font-size: 9px;
    }

    .math-clue-item p {
      margin: 0;
      color: var(--color-ink-soft);
      font-size: 9px;
      line-height: 1.7;
    }

    .math-clue-button {
      margin-top: 9px;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--color-gold);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      color: var(--color-ink-soft);
      cursor: pointer;
      font-size: 9px;
      font-weight: 700;
    }

    .math-clue-button:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .math-result-card {
      padding: 15px 17px;
      border: 1px solid var(--color-accent);
      border-radius: var(--radius-md);
      background: var(--color-accent-soft);
    }

    .math-result-card.is-win {
      border-color: var(--color-green-line);
      background: var(--color-green-soft);
    }

    .math-result-card h2 {
      margin: 0 0 7px;
      color: var(--color-accent-deep);
      font-family: var(--font-serif);
      font-size: 17px;
    }

    .math-result-card.is-win h2 {
      color: var(--color-green);
    }

    .math-result-card p {
      margin: 0;
      color: var(--color-ink-soft);
      font-size: 10px;
      line-height: 1.7;
    }

    .math-verdict {
      position: fixed;
      z-index: 1200;
      top: 17vh;
      left: 50%;
      display: grid;
      place-items: center;
      gap: 4px;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, -80px) rotate(-7deg) scale(0.35);
    }

    .math-verdict.is-visible {
      animation: math-stamp-in 0.52s cubic-bezier(0.2, 0.9, 0.25, 1.2) forwards;
    }

    .math-verdict-symbol {
      display: grid;
      width: 224px;
      height: 224px;
      place-items: center;
      border: 14px solid var(--color-accent);
      border-radius: 50%;
      background: transparent;
      color: var(--color-accent);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 0;
      font-weight: 700;
      line-height: 1;
      box-shadow: none;
    }

    .math-verdict.is-wrong .math-verdict-symbol {
      width: auto;
      height: auto;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--color-accent);
      font-size: 230px;
      line-height: 0.72;
      box-shadow: none;
    }

    .math-verdict-word {
      padding: 4px 14px;
      border-radius: 999px;
      background: var(--color-accent);
      color: var(--color-white);
      font-family: var(--font-serif);
      font-size: 20px;
      letter-spacing: 0.08em;
    }

    @keyframes math-stamp-in {
      0% {
        opacity: 0;
        transform: translate(-50%, -80px) rotate(-7deg) scale(0.35);
      }
      65% {
        opacity: 1;
        transform: translate(-50%, 0) rotate(2deg) scale(1.08);
      }
      78% {
        transform: translate(-50%, 0) rotate(-2deg) scale(0.98);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, 0) rotate(0) scale(1);
      }
    }

    @media (max-width: 760px) {
      .math-question-layout,
      .math-workspace {
        grid-template-columns: 1fr;
      }

      .math-lock-layout {
        grid-template-columns: 1fr;
      }

      .math-star-panel {
        min-height: 190px;
      }

      .math-inline-slot {
        width: 42px;
      }

      .math-sentence {
        font-size: 14px;
      }

      .math-matrix-wrap {
        display: block;
        overflow: visible;
      }

      .math-matrix {
        min-width: 0;
        grid-template-columns: minmax(0, 1fr) repeat(4, 34px);
      }

      .math-matrix-option {
        grid-template-columns: 10px minmax(0, 1fr);
        gap: 1px;
        padding: 6px 2px;
        font-size: 10px;
      }

      .math-matrix-option b {
        font-size: 9px;
      }

      .math-matrix-head {
        padding: 7px 0;
        font-size: 9.5px;
        white-space: nowrap;
      }

      .math-matrix-cell {
        padding: 5px 2px;
      }

      .math-candidate {
        grid-template-columns: minmax(0, 1fr) 15px;
        width: 100%;
        max-width: 32px;
      }

      .math-number,
      .math-block {
        min-height: 29px;
        font-size: 11px;
      }

      .math-assign {
        min-height: 40px;
        padding: 3px 1px;
        font-size: 10px;
      }

      .math-mobile-slot {
        overflow: hidden;
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        background: var(--color-surface);
      }

      .math-mobile-slot-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        background: var(--color-paper-soft);
        color: var(--color-ink-soft);
        font-size: 9px;
      }

      .math-mobile-slot.is-star .math-mobile-slot-head {
        background: var(--color-accent-soft);
        color: var(--color-accent-deep);
      }

      .math-mobile-options {
        display: grid;
      }

      .math-mobile-option {
        display: grid;
        grid-template-columns: 31px minmax(0, 1fr) 30px;
        align-items: center;
        gap: 7px;
        min-height: 40px;
        padding: 4px 8px;
        border-top: 1px solid var(--color-border);
      }

      .math-mobile-option.is-selected {
        background: var(--color-accent-soft);
      }

      .math-mobile-option.is-assigned {
        background: var(--color-green-soft);
      }

      .math-mobile-option.is-blocked {
        opacity: 0.48;
      }

      .math-mobile-number,
      .math-mobile-block {
        display: grid;
        min-height: 30px;
        place-items: center;
        padding: 0;
        border: 1px solid var(--color-border);
        border-radius: 5px;
        background: var(--color-surface);
        cursor: pointer;
        font-size: 11px;
        font-weight: 750;
      }

      .math-mobile-number {
        color: var(--color-ink);
      }

      .math-mobile-block {
        color: var(--color-accent);
        font-size: 14px;
      }

      .math-mobile-option.is-selected .math-mobile-number {
        border-color: var(--color-accent);
        color: var(--color-accent-deep);
      }

      .math-mobile-option.is-assigned .math-mobile-number {
        border-color: var(--color-green);
        background: var(--color-green-soft);
        color: var(--color-green);
      }

      .math-mobile-number:disabled,
      .math-mobile-block:disabled {
        cursor: default;
      }

      .math-mobile-option-text {
        min-width: 0;
        font-family: var(--font-serif);
        font-size: 11px;
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      .math-mobile-assign {
        width: calc(100% - 16px);
        min-height: 35px;
        margin: 0 8px 8px;
        border: 1px solid var(--color-accent);
        border-radius: 5px;
        background: var(--color-accent-soft);
        color: var(--color-accent-deep);
        cursor: pointer;
        font-size: 9px;
        font-weight: 750;
      }

      .math-mobile-assign.is-undo {
        border-color: var(--color-green);
        background: var(--color-green-soft);
        color: var(--color-green);
      }

      .math-mobile-assign:disabled {
        border-color: var(--color-border);
        background: var(--color-paper-soft);
        color: var(--color-ink-faint);
        cursor: not-allowed;
      }

      .math-verdict-symbol {
        width: 224px;
        height: 224px;
        font-size: 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function highlightedText(text, highlights) {
  let cursor = 0;
  let output = "";
  for (const fragment of highlights) {
    const found = text.indexOf(fragment, cursor);
    if (found === -1) continue;
    output += escapeHtml(text.slice(cursor, found));
    output += `<span class="hl">${escapeHtml(fragment)}</span>`;
    cursor = found + fragment.length;
  }
  return output + escapeHtml(text.slice(cursor));
}

  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    if (saved.statuses && typeof saved.statuses === "object") {
      for (const question of questions) {
        const result = saved.statuses[question.id]
          ?? (question.session === "2026.7" ? saved.statuses[question.number] : null);
        if (result === "correct" || result === "wrong") {
          state.statuses[question.id] = result;
        }
      }
      return;
    }

    for (const key of LEGACY_STORAGE_KEYS) {
      const legacy = JSON.parse(localStorage.getItem(key) || "{}");
      const legacyStatuses = legacy.statuses || {};
      const solved = new Set(Array.isArray(legacy.solved) ? legacy.solved : []);
      const wrong = new Set(Array.isArray(legacy.wrong) ? legacy.wrong : []);
      for (const question of questions) {
        if (question.session !== "2026.7") continue;
        const result = legacyStatuses[question.number]
          ?? legacyStatuses[question.id]
          ?? (solved.has(question.number) ? "correct" : wrong.has(question.number) ? "wrong" : null);
        if (result === "correct" || result === "wrong") {

function blockById(session, id) {

function blockSize(block) {
  return block.members.length;
}

function blockLabel(block) {
  return block.kind === "composite"
    ? `${block.id}(${block.members.join("")})`
    : block.id;
}

function blockText(question, block) {
  return block.members
    .map((id) => optionById(question, id).text)
    .join(" + ");
}

function findBlockStart(session, blockId) {
  return session.slots.indexOf(blockId);
}

function isBlockPlaced(session, blockId) {
  return findBlockStart(session, blockId) !== -1;
}

function flattenSlotMembers(session) {
  const result = [];
  const seen = new Set();
  for (const id of session.slots) {
    if (!id || seen.has(id)) continue;
    seen.add(id);
    const block = blockById(session, id);
    if (block) result.push(...block.members);
  }
  return result;
}

function arrangementBySlot(session) {
  return session.slots.map((id, index) => {
    if (!id) return null;
    const block = blockById(session, id);
    const start = findBlockStart(session, id);
    return block.members[index - start] ?? null;
  });
}

    }
  }

  if (!valid) console.error(`排序块状态异常：第${currentQuestion().id}题`);
  return valid;
}

const DAY_MS = 86400000;
const JLPT_EXAM_SCHEDULE = [
  "2026-12-06",
  "2027-07-04",
  "2027-12-05"
];

function utcDayFromISO(dateString) {
  const [year, month, day] = dateString.split("-").map(Number);
  return Date.UTC(year, month - 1, day);
}

function getNextJLPTExam(timestamp = Date.now()) {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "Asia/Shanghai",
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(new Date(timestamp));
  const value = (type) => Number(parts.find((part) => part.type === type)?.value);
  const month = String(value("month")).padStart(2, "0");
  const day = String(value("day")).padStart(2, "0");
  const todayDate = `${value("year")}-${month}-${day}`;
  const todayUtc = utcDayFromISO(todayDate);
  const sortedSchedule = [...JLPT_EXAM_SCHEDULE]
    .sort((left, right) => utcDayFromISO(left) - utcDayFromISO(right));
  const nextExamDate = sortedSchedule.find((date) => utcDayFromISO(date) >= todayUtc);
  if (!nextExamDate) return null;

  return {
    date: nextExamDate,
    days: Math.round((utcDayFromISO(nextExamDate) - todayUtc) / DAY_MS)
  };
}

function renderCountdown() {
  try {
    const nextExam = getNextJLPTExam();
    if (!nextExam) {
      elements.countdownDays.textContent = "--";
      elements.countdownLabel.textContent = "待公布";
      elements.countdownDate.textContent = "";
      elements.countdownCard.setAttribute("aria-label", "下一场 JLPT 考试日期待公布");
      return;
    }

    const shortDate = nextExam.date.slice(5).replace("-", ".");
    elements.countdownDays.textContent = String(nextExam.days);
    elements.countdownDate.textContent = nextExam.days === 0 ? "" : shortDate;
    elements.countdownLabel.textContent = nextExam.days === 0 ? "今日 JLPT" : "距 JLPT ·";
    elements.countdownCard.setAttribute(
      "aria-label",
      nextExam.days === 0
        ? `今天是 ${nextExam.date}，JLPT 考试日`
        : `距离 ${nextExam.date} 的 JLPT 考试还有 ${nextExam.days} 天`
    );
  } catch {
    elements.countdownDays.textContent = "--";
    elements.countdownLabel.textContent = "待公布";
    elements.countdownDate.textContent = "";
    elements.countdownCard.setAttribute("aria-label", "下一场 JLPT 考试日期待公布");
  }
}

function scheduleCountdownRefresh() {
  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: "Asia/Shanghai",
    hour: "2-digit",
    minute: "2-digit",
    second: "2-digit",
    hourCycle: "h23"
  }).formatToParts(new Date()).reduce((result, part) => {
    result[part.type] = part.value;
    return result;
  }, {});
  const elapsed = Number(parts.hour) * 3600 + Number(parts.minute) * 60 + Number(parts.second);
  const delay = Math.max(1000, (DAY_MS / 1000 - elapsed + 1) * 1000);
  window.setTimeout(() => {
    renderCountdown();
    scheduleCountdownRefresh();
  }, delay);
}
